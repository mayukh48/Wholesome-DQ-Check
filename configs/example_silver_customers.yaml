# Example config for a SILVER-layer table.
# Silver is cleaned/conformed data, so we tighten checks: enforce uniqueness
# of the primary key, validate value ranges/formats, check a foreign key
# (country_code) against a reference dataset, reconcile row counts against
# the raw bronze load, cross-check status against a second system (CRM) on
# a different coding scheme, and make sure this customer's SCD Type 2
# version history never has two overlapping "current" rows. Some checks are
# "warning" severity - they get recorded and are visible on a dashboard,
# but a small rate of bad values won't halt the pipeline; "critical" checks
# will.

dataset: customers
layer: silver

checks:
  - name: customer_id_not_null
    type: completeness
    column: customer_id
    severity: critical
    threshold: 1.0

  - name: customer_id_unique
    type: uniqueness
    columns: [customer_id]      # use `columns` (list) for composite keys, `column` also works for a single key
    severity: critical
    threshold: 1.0

  - name: age_within_range
    type: range
    column: age
    min: 0
    max: 120
    severity: warning
    threshold: 0.99              # allow up to 1% of rows to have a bad age before flagging FAIL

  - name: status_is_known_value
    type: value_set
    column: status
    allowed_values: [ACTIVE, INACTIVE, PENDING]
    severity: warning
    threshold: 1.0

  - name: email_looks_valid
    type: regex
    column: email
    pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    severity: warning
    threshold: 0.98

  - name: country_code_exists
    type: referential_integrity
    column: country_code
    ref_dataset: countries       # must match a key passed in --ref-table / ref_dfs
    ref_column: code
    severity: critical
    threshold: 1.0

  - name: record_is_fresh
    type: freshness
    column: updated_at
    max_age_hours: 24
    severity: warning

  - name: no_customer_record_is_stale
    type: stale_record
    column: updated_at
    max_age_hours: 8760   # ~1 year - every individual customer's own record, not just the newest one
    severity: warning
    threshold: 0.95         # allow up to 5% of customers to be overdue for a refresh
    # freshness (above) only proves the newest row in the table is recent -
    # it says nothing about a specific customer whose address hasn't been
    # touched in years while everyone else's updates regularly. This checks
    # every row's own timestamp, not just the table's max.

  - name: raw_vs_silver_row_count
    type: reconciliation
    ref_dataset: raw_customers   # must match a key passed in --ref-table / ref_dfs
    severity: critical
    threshold: 0.99               # allow up to 1% row loss between raw and cleansed, e.g. from dedup

  - name: country_region_matches_master
    type: accuracy
    column: country_code          # join key
    match_column: region           # attribute that must agree with the master's value
    ref_dataset: countries        # must match a key passed in --ref-table / ref_dfs
    severity: critical
    threshold: 1.0
    # referential_integrity (above) only proves country_code *exists* in the
    # master; this proves the region this customer was mapped to for that
    # country_code is actually *correct* - catches "depot mapped to wrong
    # state"-style errors that referential_integrity alone can't see.

  - name: is_active_matches_crm
    type: accuracy
    column: customer_id
    match_column: status           # this table stores ACTIVE/INACTIVE
    ref_dataset: crm               # must match a key passed in --ref-table / ref_dfs
    ref_match_column: active_flag  # the CRM stores 1/0 for the same fact
    value_map: {ACTIVE: 1, INACTIVE: 0, PENDING: 0}
    severity: critical
    threshold: 1.0
    # Two systems, two coding schemes, same underlying fact - value_map
    # translates this side before comparing so "ACTIVE" vs 1 isn't a false
    # mismatch. Catches "customer status = Active in CRM but Closed in
    # Billing"-style drift once the two are on a common scale.

  - name: no_customer_version_overlap
    type: scd_overlap
    columns: [customer_id]       # entity key
    start_column: valid_from
    end_column: valid_to           # NULL means "still the current version"
    severity: critical
    threshold: 1.0
    # Catches an SCD Type 2 merge defect: two versions of the same customer
    # both claiming to be valid at the same point in time. uniqueness alone
    # can't see this - it only catches an exact duplicate key, not two
    # overlapping date *ranges*.
