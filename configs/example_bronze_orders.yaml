# Example config for a BRONZE-layer table.
# Bronze is raw/landed data, so checks here are intentionally loose:
# just make sure something landed, the primary key exists (including
# disguised-blank order_ids, not just true NULLs) and is the expected
# length, no known placeholder values snuck in instead of a real NULL,
# every active store actually shows up today, amount roughly agrees with
# quantity x unit_price, no single order amount is a wild statistical
# outlier, the raw landed date string is actually a real date (not just
# date-shaped), a backfill isn't about to re-insert orders already in the
# target table, and the schema hasn't drifted from what the ingestion job
# expects.

dataset: orders          # logical dataset name, recorded in every result row
layer: bronze            # medallion layer, recorded in every result row - purely metadata

checks:
  - name: orders_landed
    type: row_count
    min: 1                    # fail if the ingestion produced zero rows
    severity: critical

  - name: order_id_present
    type: completeness
    column: order_id
    severity: critical
    threshold: 1.0             # 100% of rows must have a non-null order_id
    treat_blank_as_null: true   # also fail "" - a source system's way of disguising a missing order_id

  - name: amount_not_sentinel_value
    type: sentinel_value
    column: amount
    disallowed_values: [-1, 9999999]   # known placeholder values the source uses instead of a true NULL
    severity: warning
    threshold: 1.0

  - name: every_active_store_has_orders_today
    type: coverage
    column: store_id
    ref_dataset: active_stores   # must be a key in the ref_dfs dict / --ref-table
    ref_column: store_id
    severity: warning             # a quiet store is suspicious, not necessarily broken - start as a warning
    threshold: 1.0

  - name: amount_matches_quantity_times_unit_price
    type: derived_field
    column: amount
    expression: "quantity * unit_price"
    abs_tolerance: 0.01              # allow a cent of rounding drift
    severity: warning
    threshold: 0.99

  - name: amount_not_a_statistical_outlier
    type: outlier
    column: amount
    num_std_dev: 4                    # a wider band than usual - bronze data is expected to be noisy
    severity: warning
    threshold: 0.999                   # a rare fat-fingered entry shouldn't halt the pipeline, just get flagged

  - name: currency_is_uniform
    type: uniform_value
    column: currency
    allowed_values: [USD]    # every row in this feed is expected to be USD - omit allowed_values to just detect a split
    severity: critical
    threshold: 1.0
    # Catches "same metric reported in different units within the same
    # dataset" - a store accidentally sending amounts in a different
    # currency without anyone noticing until totals stopped adding up.

  - name: order_id_length_is_valid
    type: length
    column: order_id
    min: 8
    max: 12
    severity: warning
    threshold: 0.99

  - name: created_at_raw_is_a_real_date
    type: castable
    column: created_at_raw    # bronze often lands the source's raw string before it's cast to a real type
    target_type: timestamp
    severity: critical
    threshold: 0.99
    # "try_cast" rejects "13/45/2023"-style format violations *and*
    # calendar-invalid dates a regex would wrongly accept (e.g. Feb 30).

  - name: backfill_does_not_reinsert_already_loaded_orders
    type: cross_source_duplicate
    column: order_id
    ref_dataset: orders_already_loaded   # must match a key passed in --ref-table / ref_dfs - e.g. the target table itself
    ref_column: order_id
    severity: critical
    threshold: 1.0
    # Catches "backfill logic re-inserts already-processed records": if any
    # order_id in this batch already exists in the target, the backfill is
    # about to create a duplicate. Point ref_dataset at the union of another
    # source system's orders instead to catch "duplicate across merge/union
    # sources" - the same overlap check, different reference dataset.

  - name: expected_columns_present
    type: schema
    expected_schema:
      order_id: string
      customer_id: string
      store_id: string
      amount: double
      quantity: double
      unit_price: double
      currency: string
      status: string
      created_at: timestamp
      created_at_raw: string
    severity: critical
